# Compila el motor (ioquake3 para la web) con los parches de QuakeWeb.
# Fuente: fork de ioquake3 de "The Longest Yard" en un commit fijo; ver motor/README.md.
name: Motor web

on:
  push:
    paths:
      - 'motor/**'
      - '.github/workflows/motor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      IOQ3_REPO: https://github.com/jdarpinian/ioq3.git
      IOQ3_COMMIT: e4ce732d67994b3b5f0be4bc901aa982c6e79af4
      EMSDK_VERSION: 3.1.58
    steps:
      - uses: actions/checkout@v4

      - name: Bajar ioquake3 (commit fijo)
        run: |
          git init -q ioq3
          cd ioq3
          git remote add origin "$IOQ3_REPO"
          git fetch -q --depth 1 origin "$IOQ3_COMMIT"
          git checkout -q --detach FETCH_HEAD
          git log -1 --format='%H %ad %s'

      - name: Aplicar parches de QuakeWeb
        run: |
          cd ioq3
          for p in ../motor/parches/*.patch; do
            echo "== $p"
            git apply --verbose "$p"
          done

      - uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          path: emsdk

      - name: Instalar Emscripten
        run: |
          cd emsdk
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"

      # BUILD_GAME_QVM=1: el Makefile lo apaga para Emscripten, pero sin la lógica de juego en QVM
      # (ztm-flexible-hud.pk3) los mapas de Quake Live no tienen reglas: las DLL de QL no corren en la web.
      # Los QVM se compilan con herramientas nativas (q3lcc, q3asm) hechas con el gcc del runner.
      # USE_CODEC_VORBIS=1: Quake Live trae la mitad de sus sonidos en .ogg; si falta el .wav, el motor prueba
      # los otros códecs. Usa las libogg/libvorbis incluidas en el fork.
      # Sin ARCHIVE: con -j el zip se armaba antes de que existiera ztm-flexible-hud.pk3 y quedaba afuera; se
      # sube la carpeta con los archivos finales.
      - name: Compilar
        run: |
          source emsdk/emsdk_env.sh
          cd ioq3
          emmake make release BUILD_GAME_QVM=1 USE_CODEC_VORBIS=1 -j"$(nproc)"

      - name: Verificar lo generado
        run: |
          cd ioq3/build/release-emscripten-wasm32
          for f in ioquake3_opengl2.wasm32.js ioquake3_opengl2.wasm32.wasm ioq3ded.wasm32.js ioq3ded.wasm32.wasm \
                   ztm-flexible-hud.pk3 baseq3/vm/cgame.qvm baseq3/vm/qagame.qvm baseq3/vm/ui.qvm; do
            test -f "$f" || { echo "falta $f"; exit 1; }
          done
          ls -la *.js *.wasm *.pk3 *.html baseq3/vm missionpack/vm

      - uses: actions/upload-artifact@v4
        with:
          name: motor-web
          path: |
            ioq3/build/release-emscripten-wasm32/*.js
            ioq3/build/release-emscripten-wasm32/*.wasm
            ioq3/build/release-emscripten-wasm32/*.html
            ioq3/build/release-emscripten-wasm32/*.pk3
            ioq3/build/release-emscripten-wasm32/baseq3/vm/*.qvm
            ioq3/build/release-emscripten-wasm32/missionpack/vm/*.qvm
          if-no-files-found: error
          retention-days: 30
